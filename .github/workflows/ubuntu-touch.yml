name: ubuntu-touch

# Liftoff for Ubuntu Touch (REFRAME: a QML app picker + an HTML prototype demo Click, not the
# Android launcher). Lanes: logic (node), qml (Qt 5.15 lint + tests on amd64 and arm64),
# click (Clickable build of both Clicks), canary-2604 (non-blocking). Everything here is UNSIGNED.
# Click files go ONLY to a draft GitHub Release on tags, never to Actions artifact storage
# (storage has been exhausted before; see cleanup-artifacts.yml). No secrets are used.

on:
  push:
    branches: [main]
    paths: ['ubuntu-touch/**', 'tools/**', 'fixtures/**', 'docs/spherelauncher13.html', '.github/workflows/ubuntu-touch.yml']
    tags: ['ut-v*']
  pull_request:
    paths: ['ubuntu-touch/**', 'tools/**', 'fixtures/**', 'docs/spherelauncher13.html', '.github/workflows/ubuntu-touch.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-touch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fixtures regenerate byte-identically from the prototype
        run: node tools/gen_sphere_vectors.js --check
      - name: Lens math and inventory tests
        run: node --test ubuntu-touch/picker/tests/*.test.js
      - name: Packaging static checks
        run: python3 tools/check_ut_packaging.py

  qml:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Qt 5.15 QML tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qmlscene qml-module-qtquick2 \
            qml-module-qtquick-window2 qml-module-qt-labs-folderlistmodel qml-module-qttest \
            qtdeclarative5-dev-tools
      - name: qmllint
        run: /usr/lib/qt5/bin/qmllint ubuntu-touch/picker/qml/*.qml ubuntu-touch/picker/tests/tst_picker.qml
      - name: QML tests (offscreen, software scenegraph)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          XDG_RUNTIME_DIR: /tmp
        run: /usr/lib/qt5/bin/qmltestrunner -input ubuntu-touch/picker/tests/tst_picker.qml

  click:
    needs: [logic, qml]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # only used by the tag-gated draft-release step
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Clickable (pinned)
        run: |
          python3 -m pip install --user clickable-ut==8.10.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Stage the demo's www/ from the prototype
        run: ./ubuntu-touch/demo/sync-www.sh
      - name: Build picker Click (pure-qml-cmake, arch all)
        working-directory: ubuntu-touch/picker
        run: clickable build
      - name: Build demo Click (pure-qml-cmake, arch all)
        working-directory: ubuntu-touch/demo
        run: clickable build
      - name: Collect and inspect Clicks
        run: |
          mkdir -p dist
          find ubuntu-touch -name '*.click' -exec cp {} dist/ \;
          ls -l dist
          test "$(ls dist/*.click | wc -l)" -eq 2
          for c in dist/*.click; do echo "== $c"; ar t "$c"; done
      - name: Draft release (tags only; unsigned)
        if: startsWith(github.ref, 'refs/tags/ut-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "Liftoff for Ubuntu Touch $GITHUB_REF_NAME (UNSIGNED, not device-verified)" \
              --notes "Unsigned development Clicks. Reframe, not a port of the Android launcher. See ubuntu-touch/README.md."
          gh release upload "$GITHUB_REF_NAME" dist/*.click --clobber

  canary-2604:
    # Non-blocking: Qt 5.15 is end of road; this tells us when the QML toolchain disappears from newer Ubuntu.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    container: ubuntu:26.04
    steps:
      - name: "Install Qt 5.15 QML tooling (a failure here on 26.04 is the signal)"
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates qmlscene qml-module-qtquick2 \
            qml-module-qtquick-window2 qml-module-qt-labs-folderlistmodel qml-module-qttest qtdeclarative5-dev-tools
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: QML tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          XDG_RUNTIME_DIR: /tmp
        run: /usr/lib/qt5/bin/qmltestrunner -input ubuntu-touch/picker/tests/tst_picker.qml
